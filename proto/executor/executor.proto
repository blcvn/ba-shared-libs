syntax = "proto3";

package executor;

option go_package = "github.com/blcvn/backend/services/proto/executor;executor";

service ExecutorService {
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc GetToolSchema(GetToolSchemaRequest) returns (GetToolSchemaResponse);
}

message ExecuteToolRequest {
  string tool_name = 1;
  string input_json = 2;
  string session_id = 3;
}

message ExecuteToolResponse {
  bool success = 1;
  string output = 2;
  string error = 3;
  int64 duration_ms = 4;
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string description = 2;
  string category = 3;
}

message GetToolSchemaRequest {
  string tool_name = 1;
}

message GetToolSchemaResponse {
  string schema_json = 1;
}
